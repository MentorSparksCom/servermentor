{{ define "admin_head" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .PageTitle }} | Service Tracker Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="admin-header">
        <div class="header-brand">
            <a href="/admin" class="brand-link">
                <i class="fa-solid fa-server"></i>
                <h1>Service <span class="logo-accent">Tracker</span></h1>
            </a>
        </div>
        <nav class="header-nav">
            <a href="/admin" class="nav-link {{ if eq .ActiveNav "dashboard" }}active{{ end }}"><i class="fa-solid fa-house"></i> Dashboard</a>
            <a href="/admin/servers" class="nav-link {{ if eq .ActiveNav "servers" }}active{{ end }}"><i class="fa-solid fa-database"></i> Servers</a>
            <a href="/admin/services" class="nav-link {{ if eq .ActiveNav "services" }}active{{ end }}"><i class="fa-solid fa-gears"></i> Services</a>
            <a href="/admin/routes" class="nav-link {{ if eq .ActiveNav "routes" }}active{{ end }}"><i class="fa-solid fa-route"></i> Routes</a>
        </nav>
        <div class="header-user">
            <a href="/logout" class="button button-secondary button-small">Logout</a>
        </div>
    </header>

    <main class="admin-main">
{{ end }}
