{{ template "admin_head" . }}
<div class="page-header">
    <div>
        <h2>Edit {{ .Server.Name }}</h2>
        <p class="text-muted">Update primary and overlay networking plus cluster credentials.</p>
    </div>
    <a href="/admin/servers/{{ .Server.ID }}" class="button button-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back to Overview
    </a>
</div>

{{ template "server_tabs" . }}

<div class="card">
    <h3 class="card-title"><i class="fa-solid fa-pen"></i> Server Configuration</h3>
    <form action="/admin/servers/{{ .Server.ID }}/edit" method="POST">
        <div class="form-grid-2">
            <div class="form-group">
                <label for="name">Server Name</label>
                <input type="text" id="name" name="name" value="{{ .Server.Name }}" required>
            </div>
            <div class="form-group">
                <label for="provider">Provider</label>
                <input type="text" id="provider" name="provider" value="{{ .Server.Provider }}">
            </div>
        </div>

        <div class="form-grid-2">
            <div class="form-group">
                <label for="ip">IP Address</label>
                <input type="text" id="ip" name="ip" value="{{ .Server.IP }}">
            </div>
            <div class="form-group">
                <label for="overlayIp">Overlay IP</label>
                <input type="text" id="overlayIp" name="overlayIp" value="{{ .Server.OverlayIP }}">
            </div>
        </div>

        <div class="form-grid-2">
            <div class="form-group">
                <label for="ram">RAM</label>
                <input type="text" id="ram" name="ram" value="{{ .Server.RAM }}">
            </div>
            <div class="form-group">
                <label for="diskSize">Disk Size</label>
                <input type="text" id="diskSize" name="diskSize" value="{{ .Server.DiskSize }}">
            </div>
        </div>

        <div class="form-group">
            <label for="tags">Tags</label>
            <input type="text" id="tags" name="tags" value="{{ .Server.Tags }}">
        </div>

        <div class="form-group">
            <label for="kubeConfig">Cluster Login YAML (kubeconfig)</label>
            <textarea id="kubeConfig" name="kubeConfig" rows="10">{{ .Server.KubeConfig }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="button button-accent">
                <i class="fa-solid fa-floppy-disk"></i> Save Changes
            </button>
        </div>
    </form>
</div>
{{ template "admin_foot" . }}
